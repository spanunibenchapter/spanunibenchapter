name: Supabase heartbeat

on:
  schedule:
    # 06:00, 12:00 and 18:00 UTC = 07:00, 13:00 and 19:00 WAT
    - cron: "0 6,12,18 * * *"
    # Weekly export of published public CMS content (03:00 WAT Sunday)
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: supabase-heartbeat
  cancel-in-progress: false

jobs:
  ping:
    name: Check Supabase REST and database
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::Missing SUPABASE_URL repository secret"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "::error::Missing SUPABASE_ANON_KEY repository secret"; exit 1; }

      - name: Read one published CMS row (read-only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          URL="${SUPABASE_URL%/}/rest/v1/site_content?select=id&published=eq.true&limit=1"
          echo "Checking Supabase REST endpoint..."
          CODE=$(curl --silent --show-error --location --retry 3 --retry-delay 5 --retry-all-errors \
            --output /tmp/response.json --write-out "%{http_code}" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --header "Accept: application/json" "$URL")
          echo "HTTP status: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Supabase REST check failed (HTTP $CODE)"
            cat /tmp/response.json
            exit 1
          fi
          echo "Supabase responded successfully. Returned a read-only published-content sample."

      - name: Open or update an incident issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Supabase heartbeat failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The scheduled Supabase read-only health check failed.\n\n- Workflow run: ${runUrl}\n- Event: ${context.eventName}\n- Ref: ${context.ref}\n\nCheck the run logs, Supabase project status, repository secrets, and the published-content SELECT policy. Do not paste secret values into this issue.`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
              core.notice(`Updated existing incident issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
              core.notice(`Created incident issue #${created.data.number}`);
            }

  backup-published-content:
    name: Back up published public CMS content
    if: github.event_name == 'schedule' && github.event.schedule == '0 2 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Export published content using the publishable key
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          URL="${SUPABASE_URL%/}/rest/v1/site_content?select=id,module,title,date_label,body,url,image_url,extra,published,sort_order,created_at,updated_at&published=eq.true&order=module.asc,sort_order.asc"
          CODE=$(curl --silent --show-error --location --retry 3 --retry-delay 5 --retry-all-errors \
            --output published-site-content.json --write-out "%{http_code}" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --header "Accept: application/json" "$URL")
          test "$CODE" = "200" || { echo "::error::Published-content backup failed (HTTP $CODE)"; cat published-site-content.json; exit 1; }
          jq empty published-site-content.json
          echo "Exported $(jq length published-site-content.json) published rows."

      - name: Store dated backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: span-published-content-${{ github.run_id }}
          path: published-site-content.json
          if-no-files-found: error
          retention-days: 30
